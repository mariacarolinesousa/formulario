
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Caroline">
    <meta name="description" content="Formulário de contato para portfólio">
    <meta name="keywords" content="portfolio, Caroline, formulário, contato, github, freelancer, html, css">

    <link rel="stylesheet" href="style.css">

    <title>Formulário de Contato</title>
</head>

<body>

    <!-- Início do Formulário -->
    <section class="form-container">

        <div class="container">

            <form action="" method="post" id="formulario">

                <h1>Entre em Contato</h1>

                <p>Preencha o formulário abaixo e entraremos em contato com você.</p>

                <div class="input-single">
                    <input
                        type="text"
                        name="nome"
                        id="nome-box"
                        class="input"
                        autocomplete="name"
                        placeholder="Seu Nome Completo"
                        required
                    >
                    <label for="nome-box"></label>
                </div>

                <div class="input-single">
                    <input
                        type="email"
                        name="email"
                        id="email-box"
                        class="input"
                        autocomplete="email"
                        placeholder="Seu E-mail"
                        required
                    >
                    <label for="email-box"></label>
                </div>

                <div class="input-single">
                    <input
                        type="tel"
                        name="telefone"
                        id="tel-box"
                        class="input"
                        autocomplete="tel"
                        placeholder="Seu Telefone"
                        required
                    >
                    <label for="tel-box"></label>
                </div>

                <div class="btn">
                    <input type="submit" value="Enviar">
                </div>

            </form>

        </div>

    </section>
    <!-- Fim do Formulário -->

    <script src="script.js"></script>

</body>
</html>
